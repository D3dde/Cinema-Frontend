name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the bundled data snapshot a few times a day.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build server (snapshot tooling)
        run: npm -w server run build

      - name: Generate data snapshot
        run: node scripts/snapshot.mjs

      - name: Build static site
        run: npm -w web run build:static
        env:
          VITE_BASE: /Cinema-Frontend/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
